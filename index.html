<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>База клейм сварщиков / Welder Stamp Database</title>
<style>
  :root {
    --bg: #121214;
    --card: #1c1c20;
    --border: #2e2e34;
    --accent: #7e22ce;
    --accent-hover: #9333ea;
    --text: #e4e4e7;
    --muted: #a1a1aa;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px;
    margin: 0;
  }
  .container {
    width: 100%;
    max-width: 680px;
    background: var(--card);
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.6);
    border: 1px solid var(--border);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    gap: 12px;
    flex-wrap: wrap;
  }
  h2 { margin: 0; font-size: 20px; color: #fff; }
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .lang-switch {
    display: flex;
    background: #121214;
    border: 1px solid #3f3f46;
    border-radius: 8px;
    overflow: hidden;
  }
  .lang-btn {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }
  .lang-btn:hover { background: #27272c; color: #fff; }
  .lang-btn.active { background: var(--accent); color: #fff; }

  .upload-btn {
    background: #27272c;
    border: 1px dashed #52525b;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: #fff;
    transition: 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .upload-btn:hover { border-color: #a855f7; background: #2e2e36; }
  input[type="file"] { display: none; }

  .controls-bar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #16161a;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 14px;
    font-size: 13px;
  }
  .control-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .toggle-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  input[type="checkbox"] {
    accent-color: #9333ea;
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
  .threshold-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
  }
  input[type="range"] { accent-color: #9333ea; width: 85px; cursor: pointer; }

  .search-wrap { position: relative; }
  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    background: var(--bg);
    border: 1px solid #3f3f46;
    border-radius: 8px;
    color: #fff;
    outline: none;
    transition: 0.2s;
  }
  input[type="text"]:focus { border-color: #a855f7; }
  input[type="text"]:disabled { opacity: 0.5; cursor: not-allowed; }

  .suggestions {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #222227;
    border: 1px solid #3f3f46;
    border-radius: 8px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 50;
    display: none;
    box-shadow: 0 10px 25px rgba(0,0,0,0.7);
  }
  .sug-item {
    padding: 10px 14px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #2c2c32;
    font-size: 14px;
  }
  .sug-item:last-child { border-bottom: none; }
  .sug-item:hover, .sug-item.active { background: #322642; }
  .sug-stamp { font-weight: 700; color: #c084fc; font-family: monospace; font-size: 15px; }
  .sug-fio { color: #e4e4e7; }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
    gap: 8px;
    flex-wrap: wrap;
  }
  .status-actions { display: flex; gap: 12px; align-items: center; }
  .link-action {
    color: #c084fc;
    cursor: pointer;
    text-decoration: underline;
    display: none;
  }
  .err-toggle {
    color: #fbbf24;
    cursor: pointer;
    text-decoration: underline;
    display: none;
  }
  .errors-box {
    margin-top: 12px;
    padding: 12px;
    background: #271c19;
    border: 1px solid #7c2d12;
    border-radius: 8px;
    font-size: 12px;
    color: #fdba74;
    display: none;
    max-height: 160px;
    overflow-y: auto;
  }
  .errors-box ul { margin: 6px 0 0 18px; padding: 0; }

  .results {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .welder-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .stamp-badge {
    background: #3b0764;
    color: #e9d5ff;
    border: 1px solid #6b21a8;
    padding: 3px 8px;
    border-radius: 5px;
    font-family: monospace;
    font-weight: 700;
    font-size: 14px;
    margin-right: 8px;
  }
  .fio-title { font-size: 17px; font-weight: 600; color: #fff; }
  .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    background: #27272c;
    color: #e4e4e7;
    border: 1px solid #3f3f46;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: 0.15s;
  }
  button:hover { background: #3f3f46; color: #fff; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); }

  .sig-preview {
    border-radius: 6px;
    padding: 12px;
    text-align: center;
    cursor: zoom-in;
    position: relative;
    background-color: #ffffff;
    background-image:
      linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
      linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
      linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  }
  .sig-preview.solid-white { background-image: none; background-color: #ffffff; }
  .sig-preview img { max-width: 100%; max-height: 150px; object-fit: contain; display: block; margin: 0 auto; }

  .card-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .hint { font-size: 11px; color: #71717a; }
  .empty-msg { text-align: center; color: #f87171; font-size: 14px; margin-top: 16px; display: none; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal {
    background: #1c1c20;
    border: 1px solid #3f3f46;
    border-radius: 12px;
    padding: 20px;
    max-width: 92vw;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .modal-title { font-size: 15px; font-weight: 600; color: #fff; margin: 0; }
  .crop-area {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: crosshair;
    user-select: none;
  }
  .crop-area canvas { max-width: 100%; max-height: 60vh; display: block; }

  .zoom-viewport {
    width: 80vw;
    max-width: 860px;
    height: 62vh;
    border-radius: 8px;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    background-color: #ffffff;
    background-image:
      linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
      linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
      linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  }
  .zoom-viewport.solid-white { background-image: none; background-color: #ffffff; }
  .zoom-viewport img {
    transform-origin: center center;
    transition: transform 0.1s ease-out;
    max-width: 100%;
    max-height: 100%;
  }
  .zoom-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .zoom-level { font-family: monospace; font-size: 13px; color: #c084fc; min-width: 48px; text-align: center; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #16a34a;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(10px);
    transition: 0.2s;
    pointer-events: none;
    z-index: 300;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 data-i18n="title">База клейм сварщиков</h2>
    <div class="header-right">
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="tr">TR</button>
      </div>
      <label class="upload-btn">
        <span data-i18n="uploadBtn">📁 Своя папка</span>
        <input type="file" id="folderInput" webkitdirectory directory multiple>
      </label>
    </div>
  </div>

  <div class="controls-bar">
    <div class="control-row">
      <label class="toggle-label">
        <input type="checkbox" id="removeBgCheck" checked>
        <span data-i18n="removeBg">Вырезать белый фон (прозрачный PNG)</span>
      </label>
      <div class="threshold-wrap" id="thresholdWrap">
        <span data-i18n="whiteThreshold">Порог белого:</span>
        <input type="range" id="bgThreshold" min="170" max="250" value="225">
        <span id="thresholdVal">225</span>
      </div>
    </div>

    <div class="control-row">
      <label class="toggle-label">
        <input type="checkbox" id="onlyBlueCheck" checked>
        <span data-i18n="onlyBlue">Оставить только синие чернила (убрать чёрные рамки)</span>
      </label>
      <div class="threshold-wrap" id="blueWrap">
        <span data-i18n="blueStrength">Синева:</span>
        <input type="range" id="blueStrength" min="5" max="60" value="18">
        <span id="blueVal">18</span>
      </div>
    </div>
  </div>

  <div class="search-wrap">
    <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Клеймо или фамилия (можно списком: 9T47, E5L8, Иванов)..." disabled autocomplete="off">
    <div class="suggestions" id="suggestionsBox"></div>
  </div>

  <div class="status-row">
    <span id="statusText">Загрузка базы...</span>
    <div class="status-actions">
      <span class="link-action" id="resetToServerBtn" onclick="resetToServerDB()" data-i18n="resetServer">Сбросить к общей базе</span>
      <span class="err-toggle" id="errToggle"></span>
    </div>
  </div>

  <div class="errors-box" id="errorsBox">
    <b data-i18n="errBoxTitle">Проблемные файлы (проверь имена):</b>
    <ul id="errorsList"></ul>
  </div>

  <div class="empty-msg" id="emptyMsg" data-i18n="notFound">Совпадений не найдено</div>
  <div class="results" id="resultsContainer"></div>
</div>

<!-- Окно ручной обрезки -->
<div class="modal-backdrop" id="cropModal">
  <div class="modal">
    <p class="modal-title" data-i18n="cropTitle">Выдели мышкой область подписи (лишние края обрежутся и сохранятся в память)</p>
    <div class="crop-area">
      <canvas id="cropCanvas"></canvas>
    </div>
    <div class="modal-actions">
      <button onclick="closeCropModal()" data-i18n="cancel">Отмена</button>
      <button class="primary" onclick="applyCrop()" data-i18n="saveCrop">Сохранить обрезку</button>
    </div>
  </div>
</div>

<!-- Окно увеличения -->
<div class="modal-backdrop" id="zoomModal" onclick="if(event.target===this) closeZoomModal()">
  <div class="modal">
    <div class="modal-header">
      <p class="modal-title" id="zoomTitle">Подпись</p>
      <button onclick="closeZoomModal()">✕</button>
    </div>
    <div class="zoom-viewport" id="zoomViewport">
      <img id="zoomImg" src="" alt="Zoom">
    </div>
    <div class="zoom-controls">
      <div class="btn-group">
        <button onclick="changeZoom(-0.25)">➖</button>
        <span class="zoom-level" id="zoomLevelText">100%</span>
        <button onclick="changeZoom(0.25)">➕</button>
        <button onclick="resetZoom()">100%</button>
      </div>
      <div class="btn-group">
        <button class="primary" onclick="copyZoomedPng()" data-i18n="copyPng">Копировать подпись (PNG)</button>
        <button onclick="closeZoomModal()" data-i18n="close">Закрыть</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const I18N = {
    ru: {
      title: 'База клейм сварщиков',
      uploadBtn: '📁 Своя папка',
      removeBg: 'Вырезать белый фон (прозрачный PNG)',
      whiteThreshold: 'Порог белого:',
      onlyBlue: 'Оставить только синие чернила (убрать чёрные рамки)',
      blueStrength: 'Синева:',
      searchPlaceholder: 'Клеймо или фамилия (можно списком: 9T47, E5L8, Иванов)...',
      initMem: 'Загрузка базы...',
      emptyDb: 'База пуста. Выбери папку с файлами «Клеймо - ФИО.png»',
      serverLoaded: (n) => `Общая база сайта: ${n} сварщиков`,
      inMemory: (n, dt) => `Локальная копия в памяти: ${n} сварщиков${dt ? ` (от ${dt})` : ''}`,
      savedToMem: (n) => `Сохранено локально: ${n} сварщиков`,
      resetServer: 'Вернуть общую базу сайта',
      noValidFiles: 'Не найдено ни одного корректного файла',
      errToggle: (n) => `⚠️ Ошибки в именах (${n})`,
      errBoxTitle: 'Проблемные файлы (проверь имена):',
      errNotImg: (f) => `«${f}» — не картинка (пропущен)`,
      errNoDash: (f) => `«${f}» — нет дефиса между клеймом и ФИО`,
      errEmpty: (f) => `«${f}» — пустое клеймо или ФИО`,
      errDup: (s, f1, f2) => `Дубль клейма «${s}»: «${f1}» и «${f2}»`,
      notFound: 'Совпадений не найдено',
      fullNameBtn: 'ФИО полностью',
      bgTransparentHint: 'Прозрачный фон (клик по подписи — увеличить)',
      bgWhiteHint: 'Белый фон (клик по подписи — увеличить)',
      zoomBtn: '🔍 Увеличить',
      cropBtn: '✂️ Подрезать',
      copyPng: 'Копировать подпись (PNG)',
      cropTitle: 'Выдели мышкой область подписи (лишние края обрежутся и сохранятся локально)',
      cancel: 'Отмена',
      saveCrop: 'Сохранить обрезку',
      close: 'Закрыть',
      toastCopiedText: (t) => `Скопировано: ${t}`,
      toastCopiedPng: 'Подпись скопирована в буфер (PNG)',
      toastCropped: 'Обрезка сохранена!'
    },
    en: {
      title: 'Welder Stamp Database',
      uploadBtn: '📁 Custom Folder',
      removeBg: 'Remove white background (transparent PNG)',
      whiteThreshold: 'White threshold:',
      onlyBlue: 'Keep blue ink only (remove black table borders)',
      blueStrength: 'Blue level:',
      searchPlaceholder: 'Stamp or full name (batch supported: 9T47, E5L8, Smith)...',
      initMem: 'Loading database...',
      emptyDb: 'Database is empty. Select a folder with "Stamp - Full Name.png" files',
      serverLoaded: (n) => `Site database loaded: ${n} welders`,
      inMemory: (n, dt) => `Local copy in browser: ${n} welders${dt ? ` (${dt})` : ''}`,
      savedToMem: (n) => `Saved locally: ${n} welders`,
      resetServer: 'Restore site database',
      noValidFiles: 'No valid image files found',
      errToggle: (n) => `⚠️ Filename errors (${n})`,
      errBoxTitle: 'Problematic files (check filenames):',
      errNotImg: (f) => `"${f}" — not an image (skipped)`,
      errNoDash: (f) => `"${f}" — missing dash between stamp and name`,
      errEmpty: (f) => `"${f}" — empty stamp or name`,
      errDup: (s, f1, f2) => `Duplicate stamp "${s}": "${f1}" and "${f2}"`,
      notFound: 'No matches found',
      fullNameBtn: 'Full Name',
      bgTransparentHint: 'Transparent background (click signature to zoom)',
      bgWhiteHint: 'White background (click signature to zoom)',
      zoomBtn: '🔍 Zoom',
      cropBtn: '✂️ Crop',
      copyPng: 'Copy Signature (PNG)',
      cropTitle: 'Drag mouse to select signature area (edges will be cropped and saved)',
      cancel: 'Cancel',
      saveCrop: 'Save Crop',
      close: 'Close',
      toastCopiedText: (t) => `Copied: ${t}`,
      toastCopiedPng: 'Signature copied to clipboard (PNG)',
      toastCropped: 'Crop saved!'
    },
    tr: {
      title: 'Kaynakçı Damga Veritabanı',
      uploadBtn: '📁 Özel Klasör',
      removeBg: 'Beyaz arka planı kaldır (şeffaf PNG)',
      whiteThreshold: 'Beyaz eşiği:',
      onlyBlue: 'Sadece mavi mürekkebi tut (siyah çizgileri sil)',
      blueStrength: 'Mavi tonu:',
      searchPlaceholder: 'Damga veya ad soyad (toplu arama: 9T47, E5L8, Yılmaz)...',
      initMem: 'Veritabanı yükleniyor...',
      emptyDb: 'Veritabanı boş. "Damga - Ad Soyad.png" dosyalarını içeren klasörü seçin',
      serverLoaded: (n) => `Site veritabanı yüklendi: ${n} kaynakçı`,
      inMemory: (n, dt) => `Tarayıcıdaki yerel kopya: ${n} kaynakçı${dt ? ` (${dt})` : ''}`,
      savedToMem: (n) => `Yerel olarak kaydedildi: ${n} kaynakçı`,
      resetServer: 'Site veritabanına dön',
      noValidFiles: 'Geçerli resim dosyası bulunamadı',
      errToggle: (n) => `⚠️ Dosya adı hataları (${n})`,
      errBoxTitle: 'Hatalı dosyalar (isimleri kontrol edin):',
      errNotImg: (f) => `"${f}" — resim değil (atlandı)`,
      errNoDash: (f) => `"${f}" — damga ve isim arasında tire (-) yok`,
      errEmpty: (f) => `"${f}" — boş damga veya isim`,
      errDup: (s, f1, f2) => `Mükerrer damga "${s}": "${f1}" ve "${f2}"`,
      notFound: 'Eşleşme bulunamadı',
      fullNameBtn: 'Tam Adı',
      bgTransparentHint: 'Şeffaf arka plan (büyütmek için imzaya tıklayın)',
      bgWhiteHint: 'Beyaz arka plan (büyütmek için imzaya tıklayın)',
      zoomBtn: '🔍 Büyüt',
      cropBtn: '✂️ Kırp',
      copyPng: 'İmzayı Kopyala (PNG)',
      cropTitle: 'İmza alanını fareyle seçin (fazlalıklar kırpılıp kaydedilecek)',
      cancel: 'İptal',
      saveCrop: 'Kırpmayı Kaydet',
      close: 'Kapat',
      toastCopiedText: (t) => `Kopyalandı: ${t}`,
      toastCopiedPng: 'İmza panoya kopyalandı (PNG)',
      toastCropped: 'Kırpma kaydedildi!'
    }
  };

  let currentLang = localStorage.getItem('welders_lang') || 'ru';
  let lastStatusState = { type: 'init', count: 0, date: '' };
  let currentErrorsList = [];
  let hasServerDB = false;

  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('welders_lang', lang);

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });

    const dict = I18N[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (typeof dict[key] === 'string') el.textContent = dict[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (typeof dict[key] === 'string') el.placeholder = dict[key];
    });

    updateStatusText();
    renderErrors(currentErrorsList);
    handleSearchInput();
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });

  function updateStatusText() {
    const dict = I18N[currentLang];
    const st = document.getElementById('statusText');
    if (lastStatusState.type === 'init') st.textContent = dict.initMem;
    else if (lastStatusState.type === 'empty') st.textContent = dict.emptyDb;
    else if (lastStatusState.type === 'server') st.textContent = dict.serverLoaded(lastStatusState.count);
    else if (lastStatusState.type === 'memory') st.textContent = dict.inMemory(lastStatusState.count, lastStatusState.date);
    else if (lastStatusState.type === 'saved') st.textContent = dict.savedToMem(lastStatusState.count);
    else if (lastStatusState.type === 'novalid') st.textContent = dict.noValidFiles;
  }

  // --- IndexedDB ---
  const DB_NAME = 'WeldersBaseDB';
  const STORE_NAME = 'welders';
  let weldersList = []; // [{ stamp, fio, blob?, url? }]
  let activeSugIndex = -1;

  function openIDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function saveToIDB(records, errors) {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.clear();
      store.put({ id: 'meta', errors: errors, updatedAt: new Date().toLocaleDateString() });
      records.forEach((rec, idx) => {
        store.put({ id: idx + 1, stamp: rec.stamp, fio: rec.fio, blob: rec.blob || null, url: rec.url || null });
      });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function clearIDB() {
    const db = await openIDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).clear();
      tx.oncomplete = () => resolve();
    });
  }

  async function loadFromIDB() {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => {
        const all = req.result || [];
        const meta = all.find(x => x.id === 'meta');
        const records = all.filter(x => x.id !== 'meta');
        resolve({ records, meta });
      };
      req.onerror = () => reject(req.error);
    });
  }

  // --- Загрузка общей базы с сервера (db.json + папка signatures/) ---
  async function tryLoadServerDB() {
    try {
      const res = await fetch('db.json?t=' + Date.now());
      if (!res.ok) return false;
      let fileList = await res.json();
      if (typeof fileList === 'string') fileList = [fileList];
      if (!Array.isArray(fileList) || !fileList.length) return false;

      const records = [];
      const errors = [];
      const seenStamps = new Map();

      for (const fileName of fileList) {
        const nameNoExt = fileName.replace(/\.[^/.]+$/, '');
        const parts = nameNoExt.split('-');
        if (parts.length < 2) {
          errors.push({ code: 'noDash', file: fileName });
          continue;
        }
        const stamp = parts[0].trim().toUpperCase();
        const fio = parts.slice(1).join('-').trim();
        if (!stamp || !fio) {
          errors.push({ code: 'empty', file: fileName });
          continue;
        }
        if (seenStamps.has(stamp)) {
          errors.push({ code: 'dup', stamp, f1: fileName, f2: seenStamps.get(stamp) });
        } else {
          seenStamps.set(stamp, fileName);
        }
        records.push({
          stamp,
          fio,
          url: 'signatures/' + encodeURIComponent(fileName)
        });
      }

      if (records.length > 0) {
        records.sort((a, b) => a.stamp.localeCompare(b.stamp, 'ru'));
        weldersList = records;
        hasServerDB = true;
        lastStatusState = { type: 'server', count: records.length };
        enableSearch();
        renderErrors(errors);
        return true;
      }
    } catch (e) {
      return false;
    }
    return false;
  }

  async function resetToServerDB() {
    await clearIDB();
    document.getElementById('resetToServerBtn').style.display = 'none';
    const loaded = await tryLoadServerDB();
    if (loaded) handleSearchInput();
  }

  window.addEventListener('DOMContentLoaded', async () => {
    setLanguage(currentLang);
    // Проверяем, есть ли на хостинге db.json
    const serverOk = await tryLoadServerDB();

    // Если пользователь ранее загружал свою папку или подрезал подписи локально
    try {
      const { records, meta } = await loadFromIDB();
      if (records.length > 0) {
        weldersList = records;
        lastStatusState = { type: 'memory', count: records.length, date: meta?.updatedAt || '' };
        enableSearch();
        renderErrors(meta?.errors || []);
        if (serverOk) {
          document.getElementById('resetToServerBtn').style.display = 'inline';
        }
        return;
      }
    } catch (e) {}

    if (!serverOk) {
      lastStatusState = { type: 'empty' };
      updateStatusText();
    }
  });

  document.getElementById('folderInput').addEventListener('change', async function(e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    const records = [];
    const errors = [];
    const seenStamps = new Map();

    for (const file of files) {
      if (file.name.startsWith('.')) continue;
      if (!file.type.startsWith('image/')) {
        errors.push({ code: 'notImg', file: file.name });
        continue;
      }

      const nameNoExt = file.name.replace(/\.[^/.]+$/, '');
      const parts = nameNoExt.split('-');

      if (parts.length < 2) {
        errors.push({ code: 'noDash', file: file.name });
        continue;
      }

      const stamp = parts[0].trim().toUpperCase();
      const fio = parts.slice(1).join('-').trim();

      if (!stamp || !fio) {
        errors.push({ code: 'empty', file: file.name });
        continue;
      }

      if (seenStamps.has(stamp)) {
        errors.push({ code: 'dup', stamp, f1: file.name, f2: seenStamps.get(stamp) });
      } else {
        seenStamps.set(stamp, file.name);
      }

      records.push({ stamp, fio, blob: file });
    }

    records.sort((a, b) => a.stamp.localeCompare(b.stamp, 'ru'));
    weldersList = records;

    await saveToIDB(records, errors);
    renderErrors(errors);

    if (records.length > 0) {
      lastStatusState = { type: 'saved', count: records.length };
      enableSearch();
      if (hasServerDB) document.getElementById('resetToServerBtn').style.display = 'inline';
      handleSearchInput();
    } else {
      lastStatusState = { type: 'novalid' };
      updateStatusText();
      document.getElementById('statusText').style.color = '#f87171';
    }
  });

  function enableSearch() {
    const input = document.getElementById('searchInput');
    const status = document.getElementById('statusText');
    input.disabled = false;
    input.focus();
    updateStatusText();
    status.style.color = '#4ade80';
  }

  function renderErrors(errors) {
    currentErrorsList = errors || [];
    const dict = I18N[currentLang];
    const toggle = document.getElementById('errToggle');
    const box = document.getElementById('errorsBox');
    const list = document.getElementById('errorsList');

    if (currentErrorsList.length > 0) {
      toggle.style.display = 'inline';
      toggle.textContent = dict.errToggle(currentErrorsList.length);
      list.innerHTML = currentErrorsList.map(err => {
        if (typeof err === 'string') return `<li>${err}</li>`;
        if (err.code === 'notImg') return `<li>${dict.errNotImg(err.file)}</li>`;
        if (err.code === 'noDash') return `<li>${dict.errNoDash(err.file)}</li>`;
        if (err.code === 'empty') return `<li>${dict.errEmpty(err.file)}</li>`;
        if (err.code === 'dup') return `<li>${dict.errDup(err.stamp, err.f1, err.f2)}</li>`;
        return '';
      }).join('');
    } else {
      toggle.style.display = 'none';
      box.style.display = 'none';
    }
  }

  document.getElementById('errToggle').addEventListener('click', () => {
    const box = document.getElementById('errorsBox');
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
  });

  // --- Получение Blob из записи (поддержка и локальных файлов, и URL с GitHub Pages) ---
  async function getWelderBlob(w) {
    if (w.blob) return w.blob;
    if (w.url) {
      const res = await fetch(w.url);
      w.blob = await res.blob(); // Кэшируем в оперативке
      return w.blob;
    }
    return null;
  }

  // --- Очистка изображения ---
  async function processSignatureImage(welder, removeBg, threshold, onlyBlue, blueMinDiff) {
    const blob = await getWelderBlob(welder);
    if (!blob) return '';

    return new Promise((resolve) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);

        if (removeBg || onlyBlue) {
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i + 1], b = data[i + 2];

            if (removeBg && r >= threshold && g >= threshold && b >= threshold) {
              data[i + 3] = 0;
              continue;
            }

            if (onlyBlue) {
              const blueDominance = b - Math.max(r, g);
              if (blueDominance < blueMinDiff) {
                if (removeBg) {
                  data[i + 3] = 0;
                } else {
                  data[i] = 255; data[i + 1] = 255; data[i + 2] = 255;
                }
              }
            }
          }
          ctx.putImageData(imgData, 0, 0);
        }

        resolve(trimTransparentCanvas(canvas));
      };
      img.src = url;
    });
  }

  function trimTransparentCanvas(canvas) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const data = ctx.getImageData(0, 0, w, h).data;
    let minX = w, minY = h, maxX = 0, maxY = 0, found = false;

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (data[(y * w + x) * 4 + 3] > 15) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          found = true;
        }
      }
    }

    if (!found) return canvas.toDataURL('image/png');
    const pad = 4;
    minX = Math.max(0, minX - pad);
    minY = Math.max(0, minY - pad);
    maxX = Math.min(w - 1, maxX + pad);
    maxY = Math.min(h - 1, maxY + pad);

    const trimmed = document.createElement('canvas');
    trimmed.width = maxX - minX + 1;
    trimmed.height = maxY - minY + 1;
    trimmed.getContext('2d').drawImage(canvas, minX, minY, trimmed.width, trimmed.height, 0, 0, trimmed.width, trimmed.height);
    return trimmed.toDataURL('image/png');
  }

  // --- События ползунков ---
  const removeBgCheck = document.getElementById('removeBgCheck');
  const bgThreshold = document.getElementById('bgThreshold');
  const onlyBlueCheck = document.getElementById('onlyBlueCheck');
  const blueStrength = document.getElementById('blueStrength');

  removeBgCheck.addEventListener('change', () => {
    document.getElementById('thresholdWrap').style.opacity = removeBgCheck.checked ? '1' : '0.4';
    handleSearchInput();
  });
  bgThreshold.addEventListener('input', () => {
    document.getElementById('thresholdVal').textContent = bgThreshold.value;
    handleSearchInput();
  });
  onlyBlueCheck.addEventListener('change', () => {
    document.getElementById('blueWrap').style.opacity = onlyBlueCheck.checked ? '1' : '0.4';
    handleSearchInput();
  });
  blueStrength.addEventListener('input', () => {
    document.getElementById('blueVal').textContent = blueStrength.value;
    handleSearchInput();
  });

  // --- Поиск и подсказки ---
  const searchInput = document.getElementById('searchInput');
  const sugBox = document.getElementById('suggestionsBox');

  searchInput.addEventListener('input', () => {
    updateSuggestions();
    handleSearchInput();
  });

  searchInput.addEventListener('keydown', (e) => {
    const items = sugBox.querySelectorAll('.sug-item');
    if (!items.length || sugBox.style.display === 'none') return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeSugIndex = (activeSugIndex + 1) % items.length;
      highlightSuggestion(items);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeSugIndex = (activeSugIndex - 1 + items.length) % items.length;
      highlightSuggestion(items);
    } else if (e.key === 'Enter' && activeSugIndex >= 0) {
      e.preventDefault();
      items[activeSugIndex].click();
    } else if (e.key === 'Escape') {
      sugBox.style.display = 'none';
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) sugBox.style.display = 'none';
  });

  function highlightSuggestion(items) {
    items.forEach((el, idx) => el.classList.toggle('active', idx === activeSugIndex));
  }

  function updateSuggestions() {
    const raw = searchInput.value;
    const tokens = raw.split(/[,;\s]+/);
    const lastToken = tokens[tokens.length - 1].trim().toUpperCase();
    activeSugIndex = -1;

    if (!lastToken) {
      sugBox.style.display = 'none';
      return;
    }

    const matches = weldersList.filter(w =>
      w.stamp.startsWith(lastToken) || w.fio.toUpperCase().includes(lastToken)
    ).slice(0, 8);

    if (!matches.length) {
      sugBox.style.display = 'none';
      return;
    }

    sugBox.innerHTML = matches.map(m => `
      <div class="sug-item" data-stamp="${m.stamp}">
        <span class="sug-stamp">${m.stamp}</span>
        <span class="sug-fio">${m.fio}</span>
      </div>
    `).join('');

    sugBox.querySelectorAll('.sug-item').forEach(el => {
      el.addEventListener('click', () => {
        const chosenStamp = el.getAttribute('data-stamp');
        const parts = searchInput.value.split(/([,;\s]+)/);
        parts[parts.length - 1] = chosenStamp;
        searchInput.value = parts.join('');
        sugBox.style.display = 'none';
        searchInput.focus();
        handleSearchInput();
      });
    });

    sugBox.style.display = 'block';
  }

  async function handleSearchInput() {
    const raw = searchInput.value.trim();
    const container = document.getElementById('resultsContainer');
    const emptyMsg = document.getElementById('emptyMsg');
    const dict = I18N[currentLang];

    if (!raw) {
      container.innerHTML = '';
      emptyMsg.style.display = 'none';
      return;
    }

    const tokens = raw.split(/[,;\s]+/).map(t => t.trim().toUpperCase()).filter(Boolean);
    const matchedWelders = [];
    const addedStamps = new Set();

    for (const token of tokens) {
      const exactStamp = weldersList.find(w => w.stamp === token);
      if (exactStamp) {
        if (!addedStamps.has(exactStamp.stamp)) {
          matchedWelders.push(exactStamp);
          addedStamps.add(exactStamp.stamp);
        }
        continue;
      }

      if (tokens.length === 1 && token.length >= 2) {
        const byFio = weldersList.filter(w => w.fio.toUpperCase().includes(token));
        for (const w of byFio) {
          if (!addedStamps.has(w.stamp)) {
            matchedWelders.push(w);
            addedStamps.add(w.stamp);
          }
        }
      }
    }

    if (!matchedWelders.length) {
      container.innerHTML = '';
      emptyMsg.style.display = 'block';
      return;
    }

    emptyMsg.style.display = 'none';
    const removeBg = removeBgCheck.checked;
    const threshold = parseInt(bgThreshold.value, 10);
    const onlyBlue = onlyBlueCheck.checked;
    const blueMinDiff = parseInt(blueStrength.value, 10);

    const slice = matchedWelders.slice(0, 20);
    const cardsHtml = await Promise.all(slice.map(async (w, idx) => {
      const dataUrl = await processSignatureImage(w, removeBg, threshold, onlyBlue, blueMinDiff);
      const shortFio = formatShortFio(w.fio);
      return `
        <div class="welder-card">
          <div class="card-top">
            <div>
              <span class="stamp-badge">${w.stamp}</span>
              <span class="fio-title">${w.fio}</span>
            </div>
            <div class="btn-group">
              <button onclick="copyText('${escapeQuotes(w.fio)}')">${dict.fullNameBtn}</button>
              <button onclick="copyText('${escapeQuotes(shortFio)}')">${shortFio}</button>
            </div>
          </div>
          <div class="sig-preview ${removeBg ? '' : 'solid-white'}" onclick="openZoomModal('img_${idx}', '${escapeQuotes(w.stamp + ' — ' + w.fio)}')">
            <img id="img_${idx}" src="${dataUrl}" alt="Signature ${w.stamp}">
          </div>
          <div class="card-bottom">
            <span class="hint">${removeBg ? dict.bgTransparentHint : dict.bgWhiteHint}</span>
            <div class="btn-group">
              <button onclick="openZoomModal('img_${idx}', '${escapeQuotes(w.stamp + ' — ' + w.fio)}')">${dict.zoomBtn}</button>
              <button onclick="openCropModal('${w.stamp}')">${dict.cropBtn}</button>
              <button class="primary" onclick="copyPng('img_${idx}')">${dict.copyPng}</button>
            </div>
          </div>
        </div>
      `;
    }));

    container.innerHTML = cardsHtml.join('');
  }

  // --- Увеличение ---
  let currentZoom = 1;
  let currentZoomImgId = null;

  function openZoomModal(imgId, titleText) {
    const srcImg = document.getElementById(imgId);
    if (!srcImg) return;
    currentZoomImgId = imgId;
    currentZoom = 1.5;
    document.getElementById('zoomTitle').textContent = titleText;
    const zImg = document.getElementById('zoomImg');
    zImg.src = srcImg.src;
    const viewport = document.getElementById('zoomViewport');
    viewport.classList.toggle('solid-white', !removeBgCheck.checked);
    updateZoomTransform();
    document.getElementById('zoomModal').style.display = 'flex';
  }

  function closeZoomModal() {
    document.getElementById('zoomModal').style.display = 'none';
  }

  function changeZoom(delta) {
    currentZoom = Math.min(5, Math.max(0.5, +(currentZoom + delta).toFixed(2)));
    updateZoomTransform();
  }

  function resetZoom() {
    currentZoom = 1;
    updateZoomTransform();
  }

  function updateZoomTransform() {
    document.getElementById('zoomImg').style.transform = `scale(${currentZoom})`;
    document.getElementById('zoomLevelText').textContent = `${Math.round(currentZoom * 100)}%`;
  }

  document.getElementById('zoomViewport').addEventListener('wheel', (e) => {
    e.preventDefault();
    changeZoom(e.deltaY < 0 ? 0.25 : -0.25);
  }, { passive: false });

  function copyZoomedPng() {
    if (currentZoomImgId) copyPng(currentZoomImgId);
  }

  // --- Ручное кадрирование ---
  let cropTargetStamp = null;
  let cropOrigImg = null;
  let isDragging = false, startX = 0, startY = 0, curX = 0, curY = 0;

  async function openCropModal(stamp) {
    const welder = weldersList.find(w => w.stamp === stamp);
    if (!welder) return;
    const blob = await getWelderBlob(welder);
    if (!blob) return;

    cropTargetStamp = stamp;
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      cropOrigImg = img;
      const canvas = document.getElementById('cropCanvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      startX = 0; startY = 0; curX = canvas.width; curY = canvas.height;
      document.getElementById('cropModal').style.display = 'flex';
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  function closeCropModal() {
    document.getElementById('cropModal').style.display = 'none';
  }

  const cropCanvas = document.getElementById('cropCanvas');
  function getCanvasCoords(e) {
    const rect = cropCanvas.getBoundingClientRect();
    const scaleX = cropCanvas.width / rect.width;
    const scaleY = cropCanvas.height / rect.height;
    return {
      x: Math.max(0, Math.min(cropCanvas.width, (e.clientX - rect.left) * scaleX)),
      y: Math.max(0, Math.min(cropCanvas.height, (e.clientY - rect.top) * scaleY))
    };
  }

  cropCanvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    const pt = getCanvasCoords(e);
    startX = pt.x; startY = pt.y;
    curX = pt.x; curY = pt.y;
  });

  cropCanvas.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const pt = getCanvasCoords(e);
    curX = pt.x; curY = pt.y;
    const ctx = cropCanvas.getContext('2d');
    ctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
    ctx.drawImage(cropOrigImg, 0, 0);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);

    const x = Math.min(startX, curX), y = Math.min(startY, curY);
    const w = Math.abs(curX - startX), h = Math.abs(curY - startY);
    ctx.drawImage(cropOrigImg, x, y, w, h, x, y, w, h);
    ctx.strokeStyle = '#a855f7';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
  });

  window.addEventListener('mouseup', () => { isDragging = false; });

  async function applyCrop() {
    const x = Math.min(startX, curX), y = Math.min(startY, curY);
    const w = Math.abs(curX - startX), h = Math.abs(curY - startY);
    if (w < 5 || h < 5) { closeCropModal(); return; }

    const out = document.createElement('canvas');
    out.width = w; out.height = h;
    out.getContext('2d').drawImage(cropOrigImg, x, y, w, h, 0, 0, w, h);

    out.toBlob(async (newBlob) => {
      const idx = weldersList.findIndex(item => item.stamp === cropTargetStamp);
      if (idx !== -1) {
        weldersList[idx].blob = newBlob;
        // Сохраняем локально изменения
        await saveToIDB(weldersList, currentErrorsList);
        if (hasServerDB) document.getElementById('resetToServerBtn').style.display = 'inline';
        handleSearchInput();
        showToast(I18N[currentLang].toastCropped);
      }
      closeCropModal();
    }, 'image/png');
  }

  function formatShortFio(fullFio) {
    const parts = fullFio.trim().split(/\s+/);
    if (parts.length === 3) return `${parts[0]} ${parts[1][0]}.${parts[2][0]}.`;
    if (parts.length === 2) return `${parts[0]} ${parts[1][0]}.`;
    return fullFio;
  }

  function escapeQuotes(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function copyText(text) {
    navigator.clipboard.writeText(text);
    showToast(I18N[currentLang].toastCopiedText(text));
  }

  async function copyPng(imgId) {
    const img = document.getElementById(imgId);
    const res = await fetch(img.src);
    const blob = await res.blob();
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    showToast(I18N[currentLang].toastCopiedPng);
  }
