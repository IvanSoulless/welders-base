name = "welders-base-v2"
main = "src/worker.mjs"
compatibility_date = "2026-11-28"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "welders-base-v2"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "PRIVATE"
bucket_name = "welders-base-v2-private"
